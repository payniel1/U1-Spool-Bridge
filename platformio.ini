; ---------------------------------------------------------------------------
; u1-spool-bridge — PN532 filament tag reader -> Snapmaker U1
;
; Targets:
;   seeed_xiao_esp32c5        dual-band Wi-Fi 6, 8 MB flash   <- default
;   seeed_xiao_esp32c5-ota    the same env, pushed over the network
;   seeed_xiao_esp32c3        2.4 GHz, 4 MB flash, no user LED
;   seeed_xiao_esp32c3-ota    the same, over the network
;   esp32-c5-devkitc-1        the C5 devkit, N4 included — see below
;   native                    decoder tests on the host, no hardware
;
; Every target is HSU (hardware serial). The I2C and SPI transports were
; stripped: they were unreliable on these modules and nothing shipped on them.
;
; Same firmware everywhere; the 5 GHz controls simply don't appear in the web
; UI on a chip that can't do it.
;
; STATUS_LED_ACTIVE_LOW suits the XIAO's single yellow LED. If yours ends up
; lit when it should be dark, drop that flag. Boards whose variant defines
; RGB_BUILTIN (the C5 devkit, GPIO 27) take the addressable path instead and
; ignore it; the XIAO C3 has no user LED and compiles the whole thing out.
;
; The official `platform-espressif32` ships no C5 Arduino core, so we use the
; community pioarduino fork. Bump the release URL if you want a newer core.
; ---------------------------------------------------------------------------

[platformio]
default_envs = seeed_xiao_esp32c5

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Partition table is set per environment — the 4 MB devkits and the 8 MB XIAO
; want different layouts.

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
build_unflags = -std=gnu++11

; Refuses to build a partition table that overruns the board's flash, or one
; with fewer than two app slots. Neither is caught by anything else in the
; toolchain: an 8 MB table on a 4 MB board compiles clean and fails on the
; bench. It also warns (does not fail) when a table uses half the board's flash
; or less. See scripts/check_partitions.py, and `--selftest` there.
extra_scripts = pre:scripts/check_partitions.py

lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.7.0

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32-C5 — the default. Dual-band, 8 MB flash, one USB-C port.
;
; Wiring, by the silkscreen labels on the board:
;   D4 (GPIO23) -> SDA      D2 (GPIO25) -> RSTO
;   D5 (GPIO24) -> SCL      IRQ         -> unused
;   3V3 -> VCC              GND -> GND
;
; RX/TX go to the pads labelled SDA and SCL on the module — HSU and I2C share
; the same header, so nothing is rewired; see include/config.h. D2 is RSTO.
; Avoided: D3 (GPIO7) and GPIO27/28 are strapping/BOOT, D6/D7 are UART0,
; GPIO2-5 are the JTAG pads on the underside.
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c5]
extends = common
board = seeed_xiao_esp32c5
board_build.partitions = default_8MB.csv
build_flags =
    ${common.build_flags}
    -DPIN_PN532_RX=23
    -DPIN_PN532_TX=24
    -DPIN_PN532_RST=25
    -DSTATUS_LED_ACTIVE_LOW

; Push a build over the network instead of USB. Once a box has OTA-capable
; firmware on it, every later update is:
;   pio run -e seeed_xiao_esp32c5-ota -t upload --upload-port u1-drybox-3.local
; Add --upload-flags --auth=YOURPASSWORD if you set an OTA password.
[env:seeed_xiao_esp32c5-ota]
extends = env:seeed_xiao_esp32c5
upload_protocol = espota

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32-C3 — 2.4 GHz only, 4 MB flash.
;
; Same three pads as the C5, so a drybox harness moves across unmodified; only
; the GPIO numbers behind them differ:
;   D4 (GPIO6) -> SDA pad   D2 (GPIO4) -> RSTO
;   D5 (GPIO7) -> SCL pad   IRQ        -> unused
;   3V3 -> VCC              GND -> GND
;
; min_spiffs is NOT optional here. The app is ~1.41 MB and the default 4 MB
; layout gives 1.25 MB OTA slots, so a default build has nowhere to write an
; update to. min_spiffs gives 1.875 MB slots (~72% full).
;
; Two things this board does not have, both handled by the code rather than
; needing flags: no 5 GHz radio (HAS_DUAL_BAND resolves to 0 and the band
; controls vanish from the web UI), and no user LED — the variant defines
; neither LED_BUILTIN nor RGB_BUILTIN, so the status-light code compiles out.
;
; Avoided: D0 (GPIO2), D8 (GPIO8), D9 (GPIO9) are strapping pins — GPIO9 is
; BOOT — and D6/D7 (GPIO21/20) are UART0, which carries the boot log.
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c3]
extends = common
board = seeed_xiao_esp32c3
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -DPIN_PN532_RX=6
    -DPIN_PN532_TX=7
    -DPIN_PN532_RST=4

[env:seeed_xiao_esp32c3-ota]
extends = env:seeed_xiao_esp32c3
upload_protocol = espota

; ---------------------------------------------------------------------------
; Espressif ESP32-C5-DevKitC-1 — and the N4, which is the same board.
;
; PlatformIO carries four ids for this devkit. `esp32-c5-devkitc-1` and
; `esp32-c5-devkitc1-n4` have byte-identical board definitions apart from the
; display name (esp32c5 variant, 4 MB, no PSRAM), so an N4 uses this env
; unchanged — there is nothing to set. The other two are different parts and
; want a bigger table:
;
;   esp32-c5-devkitc1-n8r4    8 MB + 4 MB PSRAM   default_8MB.csv
;   esp32-c5-devkitc1-n16r4  16 MB + 4 MB PSRAM   default_16MB.csv
;
; Point this env at one of those without changing the table and it still
; works, but on half the flash; check_partitions.py warns when that happens.
;
; Pins are GPIO0/1/10, matching the esp32c5 variant's SDA/SCL. Avoid GPIO 27 —
; that is the onboard RGB LED (PIN_RGB_LED), which the status light drives.
;
; No prebuilt image ships for this board. The release .bin files are XIAO
; builds: XIAO pins, and an 8 MB partition table that would run off the end of
; this 4 MB part on the first OTA.
; ---------------------------------------------------------------------------
[env:esp32-c5-devkitc-1]
extends = common
board = esp32-c5-devkitc-1
; Was huge_app.csv, which has a single app partition — that quietly left the
; devkit with no OTA at all, so it could never take a fleet update. The C5
; devkit is a 4 MB part, so min_spiffs is the right table: two 1.875 MB slots.
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -DPIN_PN532_RX=0
    -DPIN_PN532_TX=1
    -DPIN_PN532_RST=10

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Only the hardware-free translation units.
build_src_filter =
    +<spool_data.cpp>
    +<crypto_hkdf.cpp>
    +<dec_openspool.cpp>
    +<dec_bambu.cpp>
    +<dec_qidi.cpp>
    +<spoolman_fields.cpp>
    +<send_gate.cpp>
    +<fleet_wire.cpp>
    +<u1_reply.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNIT_TEST
    -I include
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
lib_compat_mode = off
