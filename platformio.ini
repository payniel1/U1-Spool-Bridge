; ---------------------------------------------------------------------------
; u1-spool-bridge — PN532 filament tag reader -> Snapmaker U1
;
; Targets:
;   seeed_xiao_esp32c5        dual-band Wi-Fi 6, 8 MB flash   <- default, I2C
;   seeed_xiao_esp32c5-uart   same board on HSU — same wiring, sturdier
;   seeed_xiao_esp32c5-spi    same board on SPI — needs a 4-wire loom
;   seeed_xiao_esp32c5-ota    the default env, pushed over the network
;   esp32-c5-devkitc-1        dual-band Wi-Fi 6
;   esp32-c6-devkitc-1        2.4 GHz only
;   *-dual                    two readers on one board (dual-slot drybox)
;
; Same firmware everywhere; the 5 GHz controls simply don't appear in the web
; UI on a chip that can't do it, and the reader tabs only appear with two.
;
; STATUS_LED_ACTIVE_LOW suits the XIAO's single yellow LED. If yours ends up
; lit when it should be dark, drop that flag.
;
; The official `platform-espressif32` ships neither a C5 nor a C6 Arduino core,
; so we use the community pioarduino fork. Bump the release URL if you want a
; newer core.
; ---------------------------------------------------------------------------

[platformio]
default_envs = seeed_xiao_esp32c5

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Partition table is set per environment — the 4 MB devkits and the 8 MB XIAO
; want different layouts.

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
build_unflags = -std=gnu++11

lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.4
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.7.0

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32-C5 — the default. Dual-band, 8 MB flash, one USB-C port.
;
; Wiring, by the silkscreen labels on the board:
;   D4 (GPIO23) -> SDA      D2 (GPIO25) -> RSTO
;   D5 (GPIO24) -> SCL      IRQ         -> unused
;   3V3 -> VCC              GND -> GND
;
; RX/TX go to the pads labelled SDA and SCL on the module — HSU and I2C share
; the same header, so nothing is rewired; see include/config.h. D2 is RSTO.
; Avoided: D3 (GPIO7) and GPIO27/28 are strapping/BOOT, D6/D7 are UART0,
; GPIO2-5 are the JTAG pads on the underside.
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c5]
extends = common
board = seeed_xiao_esp32c5
board_build.partitions = default_8MB.csv
build_flags =
    ${common.build_flags}
    -DPIN_PN532_RX=23
    -DPIN_PN532_TX=24
    -DPIN_PN532_RST=25
    -DSTATUS_LED_ACTIVE_LOW

; Push a build over the network instead of USB. Once a box has OTA-capable
; firmware on it, every later update is:
;   pio run -e seeed_xiao_esp32c5-ota -t upload --upload-port u1-drybox-3.local
; Add --upload-flags --auth=YOURPASSWORD if you set an OTA password.
[env:seeed_xiao_esp32c5-ota]
extends = env:seeed_xiao_esp32c5
upload_protocol = espota

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32-C3 — 2.4 GHz only, 4 MB flash.
;
; Same three pads as the C5, so a drybox harness moves across unmodified; only
; the GPIO numbers behind them differ:
;   D4 (GPIO6) -> SDA pad   D2 (GPIO4) -> RSTO
;   D5 (GPIO7) -> SCL pad   IRQ        -> unused
;   3V3 -> VCC              GND -> GND
;
; min_spiffs is NOT optional here. The app is ~1.41 MB and the default 4 MB
; layout gives 1.25 MB OTA slots, so a default build has nowhere to write an
; update to. min_spiffs gives 1.875 MB slots (~72% full).
;
; Two things this board does not have, both handled by the code rather than
; needing flags: no 5 GHz radio (HAS_DUAL_BAND resolves to 0 and the band
; controls vanish from the web UI), and no user LED — the variant defines
; neither LED_BUILTIN nor RGB_BUILTIN, so the status-light code compiles out.
;
; Avoided: D0 (GPIO2), D8 (GPIO8), D9 (GPIO9) are strapping pins — GPIO9 is
; BOOT — and D6/D7 (GPIO21/20) are UART0, which carries the boot log.
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c3]
extends = common
board = seeed_xiao_esp32c3
board_build.partitions = min_spiffs.csv
build_flags =
    ${common.build_flags}
    -DPIN_PN532_RX=6
    -DPIN_PN532_TX=7
    -DPIN_PN532_RST=4

[env:seeed_xiao_esp32c3-ota]
extends = env:seeed_xiao_esp32c3
upload_protocol = espota

[env:esp32-c5-devkitc-1]
extends = common
board = esp32-c5-devkitc-1
board_build.partitions = huge_app.csv
build_flags =
    ${common.build_flags}
    -DPIN_PN532_RX=0
    -DPIN_PN532_TX=1
    -DPIN_PN532_RST=10

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Only the hardware-free translation units.
build_src_filter =
    +<spool_data.cpp>
    +<crypto_hkdf.cpp>
    +<dec_openspool.cpp>
    +<dec_bambu.cpp>
    +<dec_qidi.cpp>
    +<spoolman_fields.cpp>
    +<send_gate.cpp>
    +<fleet_wire.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNIT_TEST
    -I include
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
lib_compat_mode = off
